<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phaderkampit</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .flash {
            padding: .5rem .75rem;
            margin: .5rem 0;
            border-radius: 4px;
        }

        .flash.success {
            background: #e6ffed;
            border: 1px solid #b7eb8f;
        }

        .flash.error {
            background: #fff2f0;
            border: 1px solid #ffa39e;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .card {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 1rem;
        }

        form {
            display: grid;
            gap: .5rem;
        }

        label {
            font-weight: 600;
        }

        input,
        textarea,
        select {
            padding: .4rem .5rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        button {
            padding: .4rem .75rem;
            border: 1px solid #bbb;
            border-radius: 4px;
            background: #fafafa;
            cursor: pointer;
        }

        .nav-breadcrumb {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .nav-breadcrumb a {
            color: #007bff;
            text-decoration: none;
        }

        .nav-breadcrumb a:hover {
            text-decoration: underline;
        }

        .nav-breadcrumb .separator {
            margin: 0 0.5rem;
            color: #6c757d;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #007bff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid #007bff;
            border-radius: 4px;
            background: #f8f9fa;
            transition: background-color 0.2s;
        }

        .back-link:hover {
            background: #e9ecef;
            text-decoration: none;
        }

        .back-link::before {
            content: '←';
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-top: .5rem;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">Phaderkampit</a></h1>
    </header>

    {% block navigation %}{% endblock %}

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>

</html>
